# YIM 依赖环境 (docker compose up -d)
#
#   mysql  : 关系库 + 消息库 (宿主机 3307, 与本机 5.7 隔离)
#   redis  : 缓存体系 (宿主机 6379)
#   kafka  : 投递层队列, KRaft 单节点 (宿主机 9092, 无 ZooKeeper)
#
# 环境变量 (应用侧):
#   YIM_MYSQL_DSN      root:root@tcp(127.0.0.1:3307)/yim?charset=utf8mb4&parseTime=true&loc=Local
#   YIM_REDIS_ADDR     127.0.0.1:6379
#   YIM_KAFKA_BROKERS  127.0.0.1:9092
#
# 注: KRaft 模式 controller 监听在容器内 9093, 无需映射宿主机。

services:
  mysql:
    image: mysql:8.0
    container_name: yim-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yim
    volumes:
      - yim-mysql-data:/var/lib/mysql
      - ../scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
      --innodb-flush-log-at-trx-commit=2
    # 压测定案 (里程碑7): =1 (默认, 每事务 fsync) 时单机写吞吐 ~300/s 成为全链路
    # 瓶颈; =2 (每秒刷盘, 崩溃丢 <=1s 事务) 后发送/投递均解锁。开发环境取舍:
    # 上层 at-least-once + 幂等设计本就容忍重放, 丢 1s 事务由客户端/SYNC 补齐。
    # 生产应保留 =1 并用 Group Commit/RAID/NVMe 扩展 fsync 能力。

  redis:
    image: redis:7-alpine
    container_name: yim-redis
    ports:
      - "6379:6379"

  kafka:
    image: m.daocloud.io/docker.io/apache/kafka:3.9.0
    container_name: yim-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "8"   # 新建 topic 的默认分区数 (压测定案: 8 分区并行消费,
                                   # yim.push 曾靠 --alter 从 3 扩到 8; 卷重建后自动创建
                                   # 若无此项会退化 1 分区, 消费并行度直接没了)
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

volumes:
  yim-mysql-data:
