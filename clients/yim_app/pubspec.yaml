name: yim_app
description: YIM 客户端 — 简约克制的 IM (单代码库自适应双端).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^6.1.0
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  flutter_lucide: ^1.45.0
  intl: ^0.20.0
  window_manager: ^0.4.3
  fixnum: ^1.1.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^22.3.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

# sqlite3 (drift 的底层依赖) 在构建期从 GitHub Releases 下载预编译二进制,
# 国内直连不通 → 走镜像代理。有全局代理的环境可删掉这段恢复默认地址。
hooks:
  user_defines:
    sqlite3:
      url_pattern: https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME

flutter:
  uses-material-design: true
